<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#89ffd3" stop-opacity="0.42" />
      <stop offset="48%" stop-color="#5a7043" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0f140d" stop-opacity="0.92" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#0f140d" />
  <rect width="1200" height="1200" fill="url(#g)" />

  <g fill="none" stroke="#89ffd3" stroke-opacity="0.2">
    <circle cx="600" cy="600" r="320" />
    <circle cx="600" cy="600" r="460" />
  </g>

  <text
    x="50%"
    y="52%"
    text-anchor="middle"
    fill="#89ffd3"
    fill-opacity="0.75"
    font-size="120"
    font-family="Oswald, Arial, sans-serif"
    letter-spacing="18"
    filter="url(#glow)"
  >
    NAVALAP
  </text>
</svg>
